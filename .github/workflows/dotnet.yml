name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # 2.17 — ScrollableList and TreeView gain opt-in AutoHandleWheel / WheelStep
  # properties. When set, HandleMouse auto-routes wheel events (button 64/65)
  # into HandleWheel at the configured step. Default off keeps existing wheel
  # consumers — which do their own button-64/65 dispatch — unaffected.
  # 2.16 — MarkdownWidget gains MathMode + MathFontPath properties, so widget
  # consumers can opt display-math blocks ($$ … $$) into the pixel-render path
  # (Sixel / sextant / half-block) without bypassing the widget and reaching
  # for MarkdownRenderer.RenderLines directly. Defaults stay at single-row
  # Unicode, so existing callers are unaffected.
  # 2.15 — mhchem Phase-2 picks up box layout in display math. TryRenderMathBox
  # now expands \ce{...} via DIR.Lib.Markdown.Mhchem.ToLatex (paired with the
  # DIR.Lib 4.2 chem-to-LaTeX rewrite). Display chem inside $$ … $$ rasterises
  # via the same Sixel / sextant / half-block dispatcher as math.
  # 3.1 — markdown images. MarkdownRenderer gains a MarkdownImageOptions
  # parameter: an image alone on its own line (![alt](src)) rasterises via the
  # same Sixel / sextant / half-block path as display math (BoxRenderer.EncodeImage),
  # decoding through StbImageSharp; inline / unresolvable images fall back to alt
  # text. mdcat wires a local-file resolver (no network). Repins DIR.Lib -> 5.1.*
  # for the new MdImage AST node.
  VERSION_PREFIX: 3.1.${{ github.run_number }}
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test -c $BUILD_CONF --no-build
    # mdcat is a .NET tool (PackAsTool); tool packaging needs the publish-gather
    # that only `dotnet pack` does, so it can't ride GeneratePackageOnBuild like
    # Console.Lib. Same -p:Version melds its version with the library.
    - name: Pack mdcat tool
      run: dotnet pack src/MdCat/MdCat.csproj -c $BUILD_CONF -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}
